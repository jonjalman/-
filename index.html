<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>럭셔리 졸라맨 바카라 (Local Version)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        .velvet-gradient { background: radial-gradient(circle at center, #075e3d 0%, #033c26 70%, #011f13 100%); }
        .gold-text { background: linear-gradient(135deg, #f3e5ab 0%, #e6ca65 40%, #b8860b 80%, #f3e5ab 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-btn { background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%); color: #000; font-weight: bold; transition: all 0.3s ease; }
        .card-container { width: 76px; height: 114px; perspective: 1000px; }
        .card-inner { width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; position: relative; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { backface-visibility: hidden; position: absolute; width: 100%; height: 100%; border-radius: 0.75rem; }
        .card-back { background: #8a1d1d; border: 3px solid #e6ca65; }
        .card-front { transform: rotateY(180deg); background: white; border: 1px solid #d1d5db; }
        .chip-drawer { transition: all 0.4s; max-height: 0; overflow: hidden; }
        .chip-drawer.open { max-height: 250px; padding: 1rem 0; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-sans select-none">

    <div id="gameScreen" class="flex-1 flex flex-col">
        <header class="bg-gray-900/90 border-b border-yellow-600/30 px-4 py-3 flex justify-between items-center">
            <h1 class="text-base font-bold gold-text">STICKMAN BACCARAT</h1>
            <div id="balanceText" class="text-xl font-bold text-yellow-400">₩10,000,000</div>
        </header>

        <main class="flex-1 w-full max-w-4xl mx-auto p-4 flex flex-col gap-4">
            <div class="velvet-gradient border-4 border-yellow-900/60 rounded-3xl p-6 flex flex-col items-center">
                <div class="text-white font-bold mb-4" id="dealerBubble">칩을 걸고 게임을 시작하세요!</div>
                <svg width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="20" r="15" fill="#fff"/><path d="M50 35 L50 70 M50 50 L30 60 M50 50 L70 60 M50 70 L40 90 M50 70 L60 90" stroke="#fff" stroke-width="4"/></svg>
            </div>

            <div class="grid grid-cols-3 gap-4 text-center">
                <button onclick="placeBet('player')" class="bg-blue-900 p-4 rounded-xl">PLAYER</button>
                <button onclick="placeBet('tie')" class="bg-green-900 p-4 rounded-xl">TIE</button>
                <button onclick="placeBet('banker')" class="bg-red-900 p-4 rounded-xl">BANKER</button>
            </div>
            
            <div class="flex gap-2 justify-center">
                <button onclick="selectChip(10000)" class="bg-gray-700 p-2 rounded">1만</button>
                <button onclick="selectChip(100000)" class="bg-gray-700 p-2 rounded">10만</button>
                <button onclick="selectChip(1000000)" class="bg-gray-700 p-2 rounded">100만</button>
            </div>
        </main>
    </div>

    <script>
        let balance = 10000000;
        let selectedChip = 10000;
        let bets = { player: 0, tie: 0, banker: 0 };

        function updateUI() {
            document.getElementById('balanceText').innerText = `₩${balance.toLocaleString()}`;
        }

        function selectChip(amount) {
            selectedChip = amount;
            alert(`${amount.toLocaleString()} 칩 선택됨`);
        }

        function placeBet(type) {
            if (balance < selectedChip) {
                alert("잔액 부족!");
                return;
            }
            balance -= selectedChip;
            bets[type] += selectedChip;
            updateUI();
            alert(`${type.toUpperCase()}에 ${selectedChip.toLocaleString()} 베팅!`);
        }

        // 게임 시작 및 결과 로직은 기존 코드 구조를 활용하여 구현 가능
        updateUI();
    </script>
</body>
</html>
